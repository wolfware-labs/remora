[workspace]
resolver = "3"
members = [
    "crates/remora-types",
    "crates/remora-fs",
    "crates/remora-store",
    "crates/remora-journal",
    "crates/remora-engine",
    "crates/remora-ipc",
    "crates/remora-daemon",
    "crates/remora-host",
    "crates/remora-cli",
    "crates/remora-testkit",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wolfware-labs/remora"
homepage = "https://github.com/wolfware-labs/remora"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
remora-types = { path = "crates/remora-types", version = "0.0.0" }
remora-fs = { path = "crates/remora-fs", version = "0.0.0" }
remora-store = { path = "crates/remora-store", version = "0.0.0" }
remora-journal = { path = "crates/remora-journal", version = "0.0.0" }
remora-engine = { path = "crates/remora-engine", version = "0.0.0" }
remora-ipc = { path = "crates/remora-ipc", version = "0.0.0" }
remora-daemon = { path = "crates/remora-daemon", version = "0.0.0" }
remora-host = { path = "crates/remora-host", version = "0.0.0" }
remora-testkit = { path = "crates/remora-testkit" }
camino = "1.2.6"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
unicode-normalization = "0.1.26"
